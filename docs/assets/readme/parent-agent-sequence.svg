<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Parent-controlled subagent sequence</title>
  <desc id="desc">The parent interprets the goal, defines owned lanes, dispatches agents, inspects structured results, integrates changes, and runs the final Gate. Transport completion alone never becomes a business pass.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="64" fill="#0f172a" font-size="32" font-weight="700">The parent owns the final result</text>
    <text x="60" y="100" fill="#475569" font-size="18">Subagents return bounded evidence; they do not take over requirements, integration, or completion.</text>

    <rect x="50" y="135" width="180" height="58" rx="14" fill="#0f172a"/>
    <text x="140" y="171" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">USER</text>
    <rect x="315" y="135" width="220" height="58" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="425" y="171" fill="#1e3a8a" font-size="20" font-weight="700" text-anchor="middle">PARENT</text>
    <rect x="625" y="135" width="220" height="58" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
    <text x="735" y="171" fill="#164e63" font-size="20" font-weight="700" text-anchor="middle">BOUNDED LANES</text>
    <rect x="940" y="135" width="210" height="58" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1045" y="171" fill="#166534" font-size="20" font-weight="700" text-anchor="middle">FINAL GATE</text>

    <line x1="140" y1="193" x2="140" y2="650" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="425" y1="193" x2="425" y2="650" stroke="#2563eb" stroke-width="3"/>
    <line x1="735" y1="193" x2="735" y2="650" stroke="#0891b2" stroke-width="3"/>
    <line x1="1045" y1="193" x2="1045" y2="650" stroke="#16a34a" stroke-width="3"/>

    <line x1="140" y1="235" x2="420" y2="235" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="280" y="224" fill="#334155" font-size="16" text-anchor="middle">goal + constraints</text>

    <rect x="335" y="255" width="180" height="78" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="425" y="284" fill="#1e3a8a" font-size="17" font-weight="700" text-anchor="middle">PREFLIGHT</text>
    <text x="425" y="308" fill="#334155" font-size="14" text-anchor="middle">Goal · Done when · owners</text>
    <text x="425" y="326" fill="#334155" font-size="14" text-anchor="middle">shared boundaries · plan</text>

    <line x1="430" y1="360" x2="730" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="580" y="349" fill="#334155" font-size="16" text-anchor="middle">minimal lane packet</text>

    <rect x="645" y="385" width="180" height="84" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="735" y="414" fill="#164e63" font-size="17" font-weight="700" text-anchor="middle">WORK IN SCOPE</text>
    <text x="735" y="439" fill="#334155" font-size="14" text-anchor="middle">changed paths · command</text>
    <text x="735" y="458" fill="#334155" font-size="14" text-anchor="middle">evidence · residual risk</text>

    <line x1="730" y1="495" x2="430" y2="495" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="580" y="484" fill="#334155" font-size="16" text-anchor="middle">structured PASS / BLOCKED</text>

    <rect x="335" y="520" width="180" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="425" y="549" fill="#1e3a8a" font-size="15" font-weight="700" text-anchor="middle">INSPECT + INTEGRATE</text>
    <text x="425" y="574" fill="#334155" font-size="14" text-anchor="middle">scope · owner · diff</text>
    <text x="425" y="594" fill="#334155" font-size="14" text-anchor="middle">rerun affected evidence</text>

    <line x1="515" y1="565" x2="1040" y2="565" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="780" y="554" fill="#334155" font-size="16" text-anchor="middle">final unchanged candidate</text>

    <line x1="1040" y1="625" x2="145" y2="625" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="595" y="614" fill="#166534" font-size="17" font-weight="700" text-anchor="middle">verified outcome</text>

    <rect x="575" y="215" width="320" height="66" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="735" y="244" fill="#9a3412" font-size="17" font-weight="700" text-anchor="middle">transport completed ≠ business PASS</text>
    <text x="735" y="266" fill="#7c2d12" font-size="14" text-anchor="middle">no lane may spawn or manage another lane</text>
  </g>
</svg>
