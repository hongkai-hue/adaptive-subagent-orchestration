<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Disjoint ownership versus a shared hotspot</title>
  <desc id="desc">Disjoint directories with independent Gates can use two L2 write lanes. When both tasks need the same writable file, the parent keeps that hotspot serial and may use only a read-only explorer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="28" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="66" fill="#0f172a" font-size="32" font-weight="700">Ownership decides whether writes can run in parallel</text>
    <text x="60" y="102" fill="#475569" font-size="18">A writable path keeps one owner for the full run—including waits, batches, and retry.</text>

    <rect x="40" y="135" width="700" height="465" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="70" y="180" fill="#166534" font-size="25" font-weight="700">L2 · PARALLEL</text>
    <text x="70" y="210" fill="#475569" font-size="17">Disjoint scopes + independent Gates</text>

    <rect x="85" y="245" width="190" height="75" rx="16" fill="#0f172a"/>
    <text x="180" y="277" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">SCOPE INVENTORY</text>
    <text x="180" y="301" fill="#cbd5e1" font-size="15" text-anchor="middle">owner matrix</text>
    <line x1="275" y1="282" x2="345" y2="225" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="275" y1="282" x2="345" y2="395" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="350" y="185" width="200" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="450" y="222" fill="#1e3a8a" font-size="21" font-weight="700" text-anchor="middle">WORKER A</text>
    <text x="450" y="251" fill="#334155" font-size="17" text-anchor="middle">owns alpha/**</text>
    <text x="450" y="278" fill="#2563eb" font-size="15" font-weight="700" text-anchor="middle">alpha Gate</text>

    <rect x="350" y="355" width="200" height="110" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
    <text x="450" y="392" fill="#164e63" font-size="21" font-weight="700" text-anchor="middle">WORKER B</text>
    <text x="450" y="421" fill="#334155" font-size="17" text-anchor="middle">owns beta/**</text>
    <text x="450" y="448" fill="#0891b2" font-size="15" font-weight="700" text-anchor="middle">beta Gate</text>

    <line x1="550" y1="240" x2="615" y2="320" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="550" y1="410" x2="615" y2="340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="620" y="285" width="90" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="665" y="322" fill="#166534" font-size="17" font-weight="700" text-anchor="middle">PARENT</text>
    <text x="665" y="348" fill="#334155" font-size="14" text-anchor="middle">integrate</text>
    <text x="665" y="370" fill="#166534" font-size="14" font-weight="700" text-anchor="middle">final Gate</text>

    <rect x="775" y="135" width="385" height="465" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="805" y="180" fill="#9a3412" font-size="25" font-weight="700">SERIAL · PARENT</text>
    <text x="805" y="210" fill="#475569" font-size="17">Shared writable hotspot</text>

    <rect x="840" y="245" width="255" height="90" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="967" y="282" fill="#9a3412" font-size="20" font-weight="700" text-anchor="middle">shared/config.*</text>
    <text x="967" y="310" fill="#7c2d12" font-size="16" text-anchor="middle">one writable owner only</text>
    <line x1="967" y1="335" x2="967" y2="405" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="845" y="415" width="245" height="90" rx="18" fill="#0f172a"/>
    <text x="967" y="451" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">PARENT WRITES SERIAL</text>
    <text x="967" y="480" fill="#cbd5e1" font-size="16" text-anchor="middle">architecture + final Gate</text>

    <rect x="845" y="525" width="245" height="48" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="967" y="555" fill="#0e7490" font-size="16" font-weight="700" text-anchor="middle">optional explorer · READ ONLY</text>

    <rect x="75" y="520" width="625" height="50" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="387" y="551" fill="#166534" font-size="14" font-weight="700" text-anchor="middle">PASS = in-scope changed paths + command evidence + parent re-verification</text>
  </g>
</svg>
