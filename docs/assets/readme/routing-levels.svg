<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">L0 to L3 routing levels</title>
  <desc id="desc">A task moves to the smallest useful route: local parent work, read-only exploration, isolated implementation lanes, or a handoff to heavy orchestration. Unsafe shared writes stay serial or blocked.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="70" fill="#0f172a" font-size="32" font-weight="700">Choose the smallest useful route</text>
    <text x="60" y="104" fill="#475569" font-size="18">Independence, ownership, and Gate boundaries decide the level—not a speed promise.</text>

    <rect x="500" y="130" width="200" height="66" rx="16" fill="#0f172a"/>
    <text x="600" y="171" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">TASK</text>
    <line x1="600" y1="196" x2="600" y2="242" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

    <line x1="150" y1="250" x2="1050" y2="250" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="150" y1="250" x2="150" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="450" y1="250" x2="450" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="750" y1="250" x2="750" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1050" y1="250" x2="1050" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="35" y="285" width="230" height="190" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="80" cy="330" r="25" fill="#2563eb"/>
    <text x="80" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L0</text>
    <text x="120" y="337" fill="#0f172a" font-size="24" font-weight="700">LOCAL</text>
    <text x="60" y="385" fill="#334155" font-size="18">Small or ordered work</text>
    <text x="60" y="418" fill="#334155" font-size="18">0 subagents</text>
    <text x="60" y="451" fill="#2563eb" font-size="17" font-weight="700">Parent + final Gate</text>

    <rect x="335" y="285" width="230" height="190" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <circle cx="380" cy="330" r="25" fill="#0891b2"/>
    <text x="380" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L1</text>
    <text x="420" y="337" fill="#0f172a" font-size="24" font-weight="700">EXPLORE</text>
    <text x="360" y="385" fill="#334155" font-size="18">Independent read-only lanes</text>
    <text x="360" y="418" fill="#334155" font-size="18">1–2 explorers</text>
    <text x="360" y="451" fill="#0891b2" font-size="17" font-weight="700">Paths · lines · evidence</text>

    <rect x="635" y="285" width="230" height="190" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <circle cx="680" cy="330" r="25" fill="#059669"/>
    <text x="680" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L2</text>
    <text x="720" y="337" fill="#0f172a" font-size="24" font-weight="700">IMPLEMENT</text>
    <text x="660" y="385" fill="#334155" font-size="18">Disjoint write scopes</text>
    <text x="660" y="418" fill="#334155" font-size="18">1–3 workers/default</text>
    <text x="660" y="451" fill="#059669" font-size="17" font-weight="700">One path · one owner</text>

    <rect x="935" y="285" width="230" height="190" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="980" cy="330" r="25" fill="#7c3aed"/>
    <text x="980" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L3</text>
    <text x="1020" y="337" fill="#0f172a" font-size="24" font-weight="700">HANDOFF</text>
    <text x="960" y="385" fill="#334155" font-size="18">DAG · recovery · release</text>
    <text x="960" y="418" fill="#334155" font-size="18">0 agents here</text>
    <text x="960" y="451" fill="#7c3aed" font-size="17" font-weight="700">Heavy flow owns DAG</text>

    <rect x="60" y="515" width="1080" height="68" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="90" y="557" fill="#9a3412" font-size="19" font-weight="700">SERIAL / BLOCKED</text>
    <text x="300" y="557" fill="#7c2d12" font-size="18">Shared hotspot · strict dependency · sensitive context · missing owner or Gate</text>
  </g>
</svg>
