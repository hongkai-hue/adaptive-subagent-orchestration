<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Balanced and compute-offload routing levels</title>
  <desc id="desc">A task moves to the smallest safe route: parent-local L0, opt-in single-worker D1, read-only L1, disjoint implementation L2, or an L3 heavy-orchestration handoff.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="70" fill="#0f172a" font-size="32" font-weight="700">Choose the smallest safe route</text>
    <text x="60" y="104" fill="#475569" font-size="18">Balanced is the default; compute-offload adds D1 only when scope, owner, and Gate are exact.</text>

    <rect x="500" y="130" width="200" height="66" rx="16" fill="#0f172a"/>
    <text x="600" y="171" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">TASK</text>
    <line x1="600" y1="196" x2="600" y2="242" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

    <line x1="130" y1="250" x2="1070" y2="250" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="130" y1="250" x2="130" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="365" y1="250" x2="365" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="600" y1="250" x2="600" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="835" y1="250" x2="835" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1070" y1="250" x2="1070" y2="280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="25" y="285" width="210" height="190" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="65" cy="330" r="25" fill="#2563eb"/>
    <text x="65" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L0</text>
    <text x="103" y="337" fill="#0f172a" font-size="21" font-weight="700">LOCAL</text>
    <text x="48" y="385" fill="#334155" font-size="17">Small or ordered work</text>
    <text x="48" y="418" fill="#334155" font-size="17">0 subagents</text>
    <text x="48" y="451" fill="#2563eb" font-size="16" font-weight="700">Parent final Gate</text>

    <rect x="260" y="285" width="210" height="190" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <circle cx="300" cy="330" r="25" fill="#16a34a"/>
    <text x="300" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">D1</text>
    <text x="338" y="337" fill="#0f172a" font-size="21" font-weight="700">OFFLOAD</text>
    <text x="283" y="379" fill="#334155" font-size="16">One bounded</text>
    <text x="283" y="404" fill="#334155" font-size="16">write scope</text>
    <text x="283" y="431" fill="#334155" font-size="16">1 worker · sequential</text>
    <text x="283" y="458" fill="#16a34a" font-size="16" font-weight="700">Exact owner + Gate</text>

    <rect x="495" y="285" width="210" height="190" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <circle cx="535" cy="330" r="25" fill="#0891b2"/>
    <text x="535" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L1</text>
    <text x="573" y="337" fill="#0f172a" font-size="21" font-weight="700">EXPLORE</text>
    <text x="518" y="379" fill="#334155" font-size="16">Independent</text>
    <text x="518" y="404" fill="#334155" font-size="16">read-only lanes</text>
    <text x="518" y="431" fill="#334155" font-size="16">1–2 explorers</text>
    <text x="518" y="458" fill="#0891b2" font-size="16" font-weight="700">Paths · evidence</text>

    <rect x="730" y="285" width="210" height="190" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <circle cx="770" cy="330" r="25" fill="#059669"/>
    <text x="770" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L2</text>
    <text x="808" y="337" fill="#0f172a" font-size="21" font-weight="700">BUILD</text>
    <text x="753" y="385" fill="#334155" font-size="17">Disjoint write scopes</text>
    <text x="753" y="418" fill="#334155" font-size="17">2–3 workers</text>
    <text x="753" y="451" fill="#059669" font-size="16" font-weight="700">One path · one owner</text>

    <rect x="965" y="285" width="210" height="190" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="1005" cy="330" r="25" fill="#7c3aed"/>
    <text x="1005" y="339" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">L3</text>
    <text x="1043" y="337" fill="#0f172a" font-size="21" font-weight="700">HEAVY</text>
    <text x="988" y="379" fill="#334155" font-size="16">DAG · recovery</text>
    <text x="988" y="404" fill="#334155" font-size="16">release readiness</text>
    <text x="988" y="431" fill="#334155" font-size="16">0 agents here</text>
    <text x="988" y="458" fill="#7c3aed" font-size="16" font-weight="700">Heavy owns DAG</text>

    <rect x="60" y="515" width="1080" height="68" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="90" y="557" fill="#9a3412" font-size="19" font-weight="700">SERIAL / BLOCKED</text>
    <text x="300" y="557" fill="#7c2d12" font-size="18">Shared hotspot · strict dependency · sensitive context · missing owner or Gate</text>
  </g>
</svg>
