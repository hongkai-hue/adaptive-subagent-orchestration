<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Evidence invalidation and final Gate loop</title>
  <desc id="desc">A structured lane result is checked against scope and the current candidate. If the candidate changes, old evidence becomes stale and affected tests rerun. Only an unchanged candidate that passes the parent final Gate is accepted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="66" fill="#0f172a" font-size="32" font-weight="700">Evidence belongs to one exact candidate</text>
    <text x="60" y="102" fill="#475569" font-size="18">Any relevant change makes the old PASS stale and sends the affected Gate back around the loop.</text>

    <rect x="70" y="175" width="210" height="105" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="175" y="213" fill="#0c4a6e" font-size="18" font-weight="700" text-anchor="middle">STRUCTURED RESULT</text>
    <text x="175" y="243" fill="#334155" font-size="15" text-anchor="middle">status · changed paths</text>
    <text x="175" y="265" fill="#334155" font-size="15" text-anchor="middle">command · evidence · risk</text>

    <line x1="280" y1="227" x2="375" y2="227" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="380" y="175" width="210" height="105" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="485" y="213" fill="#1e3a8a" font-size="20" font-weight="700" text-anchor="middle">PARENT CHECK</text>
    <text x="485" y="243" fill="#334155" font-size="15" text-anchor="middle">scope · owner · diff</text>
    <text x="485" y="265" fill="#334155" font-size="15" text-anchor="middle">real exit codes</text>

    <line x1="590" y1="227" x2="685" y2="227" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="690" y="175" width="210" height="105" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="795" y="213" fill="#5b21b6" font-size="20" font-weight="700" text-anchor="middle">CANDIDATE</text>
    <text x="795" y="243" fill="#334155" font-size="15" text-anchor="middle">exact files + current diff</text>
    <text x="795" y="265" fill="#7c3aed" font-size="15" font-weight="700" text-anchor="middle">unchanged?</text>

    <line x1="900" y1="227" x2="995" y2="227" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1000" y="175" width="150" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1075" y="213" fill="#166534" font-size="20" font-weight="700" text-anchor="middle">FINAL GATE</text>
    <text x="1075" y="243" fill="#334155" font-size="15" text-anchor="middle">parent reruns</text>
    <text x="1075" y="265" fill="#16a34a" font-size="15" font-weight="700" text-anchor="middle">PASS → accept</text>

    <path d="M795 280V390H650" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#red-arrow)"/>
    <text x="815" y="337" fill="#b91c1c" font-size="17" font-weight="700">changed</text>
    <rect x="430" y="350" width="220" height="90" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="540" y="385" fill="#991b1b" font-size="20" font-weight="700" text-anchor="middle">STALE EVIDENCE</text>
    <text x="540" y="415" fill="#7f1d1d" font-size="16" text-anchor="middle">invalidate old PASS</text>

    <path d="M430 395H320Q290 395 290 365V315Q290 285 320 285H380" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#red-arrow)"/>
    <text x="310" y="340" fill="#b91c1c" font-size="15" font-weight="700" text-anchor="middle">rerun affected Gate</text>

    <rect x="70" y="500" width="340" height="100" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="240" y="538" fill="#9a3412" font-size="19" font-weight="700" text-anchor="middle">NOT BUSINESS EVIDENCE</text>
    <text x="240" y="568" fill="#7c2d12" font-size="16" text-anchor="middle">spawn success · running · transport completed</text>
    <text x="240" y="590" fill="#7c2d12" font-size="15" text-anchor="middle">unrun command · swallowed failure</text>

    <line x1="410" y1="550" x2="505" y2="550" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="510" y="500" width="270" height="100" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="645" y="538" fill="#9a3412" font-size="20" font-weight="700" text-anchor="middle">BLOCKED / FAIL</text>
    <text x="645" y="568" fill="#7c2d12" font-size="16" text-anchor="middle">missing proof or out-of-scope path</text>
    <text x="645" y="590" fill="#7c2d12" font-size="15" text-anchor="middle">one focused retry with Delta</text>

    <rect x="835" y="500" width="315" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="992" y="538" fill="#0f172a" font-size="19" font-weight="700" text-anchor="middle">PUBLIC RECORD</text>
    <text x="992" y="568" fill="#475569" font-size="15" text-anchor="middle">sanitized route · paths · commands</text>
    <text x="992" y="590" fill="#475569" font-size="15" text-anchor="middle">runtime identity stays UNVERIFIED</text>

    <path d="M1075 280V465Q1075 485 1055 485H992" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
