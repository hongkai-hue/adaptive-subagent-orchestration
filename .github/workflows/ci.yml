name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source bundle
        run: ./scripts/validate.sh .
      - name: Run recursive tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/validate.sh
      - name: Check whitespace
        run: git diff --check
